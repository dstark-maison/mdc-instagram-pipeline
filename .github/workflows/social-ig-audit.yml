# READ-ONLY. Lists the IG account's published media and matches it against the
# legacy drafts (see tools/ig_media_audit.py). Posts nothing, commits nothing.

name: Social IG Audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests Pillow
      - name: Audit
        env:
          ACCESS_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python tools/ig_media_audit.py
